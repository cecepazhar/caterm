name: Release CATerm Multi-Platform (macOS, Windows, Linux)

on:
  push:
    tags:
      - 'v*'

# Least privilege by default; only the packaging job may write the GitHub Release.
permissions:
  contents: read

jobs:
  # Packaging only starts once the full CI suite passes on the tagged commit, so a
  # release can never ship code that CI would reject.
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    needs: ci
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Same Node version and lockfile as CI, so the packaged frontend is the one CI tested.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './crates -> target'

      - name: Install Linux system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # tauri.conf.json has no beforeBuildCommand, so the bundle embeds whatever is in
      # frontend/build; build it explicitly from the locked dependencies.
      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Build and Package Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/caterm-app
          # Tauri CLI pinned by frontend/package-lock.json (no global install).
          tauriScript: npm --prefix ../../frontend exec -- tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'CATerm ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 CATerm Pro & Community Edition (${{ github.ref_name }})
            
            ### 📦 Download Packages:
            - **macOS:** Universal `.dmg` (Apple Silicon M-series & Intel)
            - **Windows:** `.msi` and `.exe` Installer (x64)
            - **Linux:** `.deb` and `.AppImage` (x86_64)

            ### 🛡️ Verification:
            - Zero-Knowledge Vault (Argon2id + AES-256-GCM)
            - Ed25519 Cryptographically Signed Binaries
            - 100% Native Rust & Svelte 5 Engine
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
